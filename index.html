<!doctype html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Central Isaque</title>
<meta name="description" content="Central Isaque · Pagamento seguro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060708; --card-2:#15181d; --line:#22262d;
    --text:#f1f3f6; --muted:#8b93a1; --dim:#5c6370;
    --blue:#2f7bff; --blue-2:#1a5cff; --blue-glow:rgba(47,123,255,.45);
    --green:#22c55e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px 16px; overflow-x:hidden; position:relative; line-height:1.5;
  }

  /* ---------- FUNDO ---------- */
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .grid{
    position:absolute;inset:-50%;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:48px 48px; transform:perspective(600px) rotateX(55deg);
    animation:gridMove 18s linear infinite;
    mask-image:radial-gradient(ellipse at center,#000 20%,transparent 65%);
    -webkit-mask-image:radial-gradient(ellipse at center,#000 20%,transparent 65%);
  }
  @keyframes gridMove{from{background-position:0 0}to{background-position:0 48px}}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
  .b1{width:480px;height:480px;background:#1a5cff;top:-160px;left:-120px;animation:f1 14s ease-in-out infinite}
  .b2{width:420px;height:420px;background:#0e2a6b;bottom:-160px;right:-100px;animation:f2 16s ease-in-out infinite}
  .b3{width:260px;height:260px;background:#3a4252;top:40%;left:60%;opacity:.25;animation:f1 20s ease-in-out infinite reverse}
  @keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,40px)}}
  @keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-60px)}}
  canvas#stars{position:absolute;inset:0;width:100%;height:100%}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.75) 100%)}

  /* ---------- CARD ---------- */
  .wrap{position:relative;z-index:1;width:100%;max-width:420px}
  .card{
    position:relative;
    background:linear-gradient(180deg,rgba(21,24,29,.88),rgba(12,14,17,.92));
    border:1px solid var(--line); border-radius:20px; padding:30px 24px 24px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.8);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .card::before{
    content:"";position:absolute;left:24px;right:24px;top:-1px;height:1px;
    background:linear-gradient(90deg,transparent,var(--blue),transparent);
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  .brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .logo{
    width:44px;height:44px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,var(--blue),#0b2f8a);
    display:grid;place-items:center;font-weight:800;font-size:17px;
    box-shadow:0 8px 24px -6px var(--blue-glow);
  }
  .brand-name{font-weight:800;font-size:17px}
  .brand-sub{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

  .label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  h1{font-size:21px;font-weight:700;margin:6px 0 4px;line-height:1.3}
  .desc{color:var(--muted);font-size:14.5px}

  .price-box{
    margin:20px 0;padding:16px 18px;border-radius:14px;background:var(--card-2);border:1px solid var(--line);
    display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  }
  .price{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .price small{font-size:15px;color:var(--muted);font-weight:600;margin-right:4px}
  .price-note{font-size:12px;color:var(--muted);text-align:right}

  .btn{
    position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:16px;border-radius:12px;
    font:700 16px 'Inter',sans-serif;color:#fff;text-decoration:none;
    background:linear-gradient(180deg,var(--blue),var(--blue-2));
    box-shadow:0 10px 30px -8px var(--blue-glow),0 1px 0 rgba(255,255,255,.2) inset;
    overflow:hidden;transition:transform .15s,box-shadow .2s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px -8px var(--blue-glow)}
  .btn::after{
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
    animation:shine 3.2s ease-in-out infinite;
  }
  @keyframes shine{0%{left:-60%}60%,100%{left:130%}}
  .btn svg{width:18px;height:18px;flex-shrink:0}

  .methods{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
  .chip{font-size:12px;color:#c4cad4;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
  .secure{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);text-align:center}
  .secure svg{width:15px;height:15px;color:var(--green);flex-shrink:0}
  .foot{text-align:center;font-size:11.5px;color:var(--dim);margin-top:18px}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="grid"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <canvas id="stars"></canvas>
  <div class="vignette"></div>
</div>

<main class="wrap">
  <div class="card">
    <div class="brand">
      <div class="logo">CI</div>
      <div>
        <div class="brand-name">Central Isaque</div>
        <div class="brand-sub"><span class="dot"></span>Ambiente de pagamento seguro</div>
      </div>
    </div>

    <div class="label">Seu orçamento</div>
    <h1 id="servico"></h1>
    <p class="desc" id="servicoDesc"></p>

    <div class="price-box">
      <div class="price"><small>R$</small><span id="valorServico"></span></div>
      <div class="price-note" id="notaServico"></div>
    </div>

    <a class="btn" id="btnPagar" href="#" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Pagar agora
    </a>
    <div class="methods"><span class="chip">Pix</span><span class="chip">Cartão de crédito</span><span class="chip">Boleto</span></div>
    <div class="secure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      Checkout seguro processado pela Kiwify
    </div>
  </div>
  <p class="foot" id="foot"></p>
</main>

<script>
  /* =========================================================
     CONFIGURACAO - TROQUE SO ESTES 4 VALORES A CADA CLIENTE
     (mantenha as aspas " " e a virgula no final da linha)
     ========================================================= */
  const CONFIG = {
    servico:       "Especialista em Páginas de Vendas",
    servicoDesc:   "Obrigado pela confiança! Abaixo está o valor combinado.",
    valorServico:  "63,33",
    linkPagamento: "https://pay.kiwify.com.br/JL11M4R",
    notaServico:   "pagamento único"
  };

  /* ---------- nao precisa mexer daqui para baixo ---------- */
  const $ = id => document.getElementById(id);
  $('servico').textContent = CONFIG.servico;
  $('servicoDesc').textContent = CONFIG.servicoDesc;
  $('valorServico').textContent = CONFIG.valorServico;
  $('notaServico').textContent = CONFIG.notaServico;
  $('foot').textContent = '© ' + new Date().getFullYear() + ' Central Isaque · Todos os direitos reservados';

  // repassa utm_* da URL para o checkout (rastreio)
  try{
    const u = new URL(CONFIG.linkPagamento);
    new URLSearchParams(location.search).forEach((v,k)=>{ if(k.startsWith('utm_') || k==='src' || k==='sck') u.searchParams.set(k,v); });
    $('btnPagar').href = u.toString();
  }catch(e){ $('btnPagar').href = CONFIG.linkPagamento; }

  // particulas
  const c = $('stars'), ctx = c.getContext('2d');
  let W, H, pts = [];
  function resize(){
    const dpr = window.devicePixelRatio || 1;
    W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr;
    const n = Math.min(90, Math.floor(innerWidth * innerHeight / 14000));
    pts = Array.from({length:n}, () => ({
      x:Math.random()*W, y:Math.random()*H, r:(Math.random()*1.4+.4)*dpr,
      vx:(Math.random()-.5)*.15*dpr, vy:(Math.random()-.5)*.15*dpr, blue:Math.random()<.45
    }));
  }
  addEventListener('resize', resize); resize();
  (function draw(){
    ctx.clearRect(0,0,W,H);
    for(const p of pts){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = p.blue ? 'rgba(80,140,255,.7)' : 'rgba(170,178,190,.35)';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  })();
</script>
</body>
</html>
